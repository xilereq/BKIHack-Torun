<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo Głos Osiedla</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root { --brand:#C8102E; --ink:#16191D; --ink-2:#5A6270; --line:#E2E5E9; --canvas:#F5F6F8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font-family:"Atkinson Hyperlegible", system-ui, sans-serif; font-size:18px; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:28px; margin:0 0 4px; }
  .lead { color:var(--ink-2); margin:0 0 32px; }
  .variant { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:24px; }
  .variant.rec { border:2px solid var(--brand); }
  .head { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 12px; margin-bottom:6px; }
  .head h2 { font-size:22px; margin:0; }
  .tag { font-size:14px; font-weight:700; color:var(--brand); background:#FDECEE; border-radius:999px; padding:2px 10px; }
  .idea { color:var(--ink-2); margin:0 0 20px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:16px; }
  .tile { border-radius:12px; min-height:150px; display:flex; align-items:center; justify-content:center; gap:14px; padding:20px; }
  .light { background:#fff; border:1px solid var(--line); }
  .dark { background:var(--ink); color:#fff; }
  .red { background:var(--brand); color:#fff; }
  .word { font-weight:700; font-size:28px; letter-spacing:-0.01em; line-height:1; white-space:nowrap; }
  .sizes { display:flex; align-items:flex-end; gap:20px; }
  .sizes span { display:block; text-align:center; font-size:13px; color:var(--ink-2); margin-top:6px; }
  .dark .sizes span, .red .sizes span { color:rgba(255,255,255,.75); }
  svg { display:block; flex-shrink:0; }
</style>
</head>
<body>
<main>
  <h1>Logo Głos Osiedla — propozycje</h1>
  <p class="lead">Czerń, biel i czerwień marki #C8102E. Każdy znak sprawdzony od 16 px (ikona karty) do dużego formatu.</p>
  <div id="list"></div>
</main>
<script>
  // f = kolor wypełnienia znaku, g = kolor elementów wewnątrz
  const marks = {
    bloki: (f, g) => `
      <path fill="${f}" d="M13 6H35A9 9 0 0 1 44 15V27A9 9 0 0 1 35 36H22L13 43V36A9 9 0 0 1 4 27V15A9 9 0 0 1 13 6Z"/>
      <g fill="${g}"><rect x="13" y="20" width="6" height="9" rx="1"/><rect x="21" y="13" width="6" height="16" rx="1"/><rect x="29" y="17" width="6" height="12" rx="1"/></g>`,
    dach: (f, g) => `
      <path fill="${f}" d="M24 4A19 19 0 1 1 11.3 38.1L5 42L7.4 34.4A19 19 0 0 1 24 4Z"/>
      <path fill="none" stroke="${g}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M14 24L24 15L34 24M18 22V32H30V22"/>`,
    cudzyslow: (f, g) => `
      <rect x="2" y="2" width="44" height="44" rx="11" fill="${f}"/>
      <g fill="${g}">
        <circle cx="17" cy="29" r="5.5"/><path d="M22.5 29C22.5 35 19 39.5 12.5 41C15.5 38.5 16.5 36 16.2 34.4Z"/>
        <circle cx="32" cy="29" r="5.5"/><path d="M37.5 29C37.5 35 34 39.5 27.5 41C30.5 38.5 31.5 36 31.2 34.4Z"/>
      </g>`,
  }
  const svg = (k, size, f, g) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${marks[k](f, g)}</svg>`

  const variants = [
    { k: 'bloki', name: 'A. Dymek z blokami', rec: true,
      idea: 'Dymek to głos mieszkańca, trzy słupki to bloki osiedla i zarazem poziom głosu. Czytelny nawet jako ikona karty przeglądarki.' },
    { k: 'dach', name: 'B. Dymek z domem',
      idea: 'Okrągły dymek z prostym zarysem domu: „mówię o swoim miejscu”. Cieplejszy, ale dom kojarzy się bardziej z domkiem niż z osiedlem bloków.' },
    { k: 'cudzyslow', name: 'C. Polski cudzysłów',
      idea: 'Dolny cudzysłów „ — typowo polski znak cytatu, czyli czyjś głos. Najbardziej typograficzny i oszczędny, mniej mówi o osiedlu.' },
  ]

  document.getElementById('list').innerHTML = variants.map(v => `
    <section class="variant ${v.rec ? 'rec' : ''}">
      <div class="head"><h2>${v.name}</h2>${v.rec ? '<span class="tag">Polecany</span>' : ''}</div>
      <p class="idea">${v.idea}</p>
      <div class="row">
        <div class="tile light">${svg(v.k, 56, '#C8102E', '#fff')}<div class="word">Głos Osiedla</div></div>
        <div class="tile dark">${svg(v.k, 56, '#C8102E', '#fff')}<div class="word">Głos Osiedla</div></div>
        <div class="tile red">${svg(v.k, 56, '#fff', '#C8102E')}<div class="word">Głos Osiedla</div></div>
        <div class="tile light"><div class="sizes">
          ${[16, 24, 36, 64, 96].map(s => `<div>${svg(v.k, s, '#C8102E', '#fff')}<span>${s}</span></div>`).join('')}
        </div></div>
        <div class="tile light"><div class="sizes">
          ${svg(v.k, 64, '#16191D', '#fff')}${svg(v.k, 64, '#C8102E', '#16191D')}
        </div></div>
      </div>
    </section>`).join('')
</script>
</body>
</html>
